name: Client dependency validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'client/**'
      - '.github/workflows/client-dependencies.yml'
  push:
    branches: [master, dev]
    paths:
      - 'client/**'
      - '.github/workflows/client-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Angular application
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Audit target transitive dependencies (include dev)
        shell: bash
        run: |
          npm audit --include=dev --json > /tmp/skinet-audit.json || true
          node - /tmp/skinet-audit.json <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const findings = data.vulnerabilities || {};
          console.log('Full dependency audit counts:', JSON.stringify(data.metadata?.vulnerabilities || {}));
          console.log('Vulnerable packages:', Object.keys(findings).join(', ') || '(none)');
          const targets = ['undici', 'qs'];
          const remaining = targets.filter(name => Boolean(findings[name]));
          console.log('Affected targets:', remaining.join(', ') || '(none)');
          if (data.error || remaining.length) process.exit(1);
          NODE
      - name: Diagnose remaining development dependency vulnerabilities
        shell: bash
        run: |
          npm audit --include=dev --json > /tmp/skinet-audit-details.json || true
          node - /tmp/skinet-audit-details.json <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          for (const name of ['@angular/cli','body-parser','engine.io','ip-address','nanoid','probe-image-size','zod']) {
            const entry = audit.vulnerabilities?.[name];
            if (!entry) { console.log('AUDIT_DETAIL', JSON.stringify({name, status:'clear'})); continue; }
            console.log('AUDIT_DETAIL', JSON.stringify({name, severity:entry.severity, range:entry.range, nodes:entry.nodes, fixAvailable:entry.fixAvailable, via:entry.via.map(v=>typeof v==='string'?v:{name:v.name,title:v.title,url:v.url,range:v.range,severity:v.severity})}));
          }
          if (audit.error) process.exit(1);
          NODE

name: Client dependency validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'client/**'
      - '.github/workflows/client-dependencies.yml'
  push:
    branches: [master, dev]
    paths:
      - 'client/**'
      - '.github/workflows/client-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Refresh lockfile for follow-redirects security fix
        if: github.event_name == 'pull_request' && github.head_ref == 'security/fix-dev-audit-20261031' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): update follow-redirects lockfile"
            git push origin HEAD:refs/heads/security/fix-dev-audit-20261031
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Angular application
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (including dev)
        run: npm audit --include=dev --audit-level=moderate

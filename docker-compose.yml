services:
  skinet:
    image: skinet:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Data source=/data/skinet.db"
    volumes:
      - skinet-data:/data

volumes:
  skinet-data:

<header class="site-header">
  <a class="wordmark" routerLink="/shop">SkiNet</a>
  <nav aria-label="網站導覽">
    <a routerLink="/shop">商品目錄</a>
    <a routerLink="/favorites">收藏（{{ favorites.count() }}）</a>
    <a routerLink="/recently-viewed">最近瀏覽</a>
    <a routerLink="/compare">比較（{{ comparison.count() }}）</a>
    <a routerLink="/cart">購物車（{{ cart.totalQuantity() }}）</a>
  </nav>
  <p class="tagline">雪板、雪靴與雪地配件</p>
</header>
<p class="favorites-feedback" role="status" aria-atomic="true">
  {{ favorites.feedback() }}
  @if (favorites.storageWarning(); as warning) {
    <span class="favorites-warning">{{ warning }}</span>
  }
</p>
<p class="comparison-feedback" role="status" aria-atomic="true">{{ comparison.feedback() }}</p>

services:
  skinet:
    image: ${SKINET_IMAGE:?Set SKINET_IMAGE}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Data source=/data/skinet.db"
    volumes:
      - skinet-data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - skinet
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  skinet-data:
    external: true
    name: ${SKINET_DATA_VOLUME:?Set SKINET_DATA_VOLUME}
